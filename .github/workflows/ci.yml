name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- Check: cargo check + clippy + vite build ----
  # Windows runner: the Rust backend is Windows-first and does not compile on
  # Linux yet (un-gated `windows` crate usage, HWND APIs). Re-add a Linux job
  # when the crate is cross-platform.
  check:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: clippy

      # LLVM for whisper-rs (libclang)
      - name: Install LLVM
        run: choco install llvm --yes --no-progress
        shell: pwsh

      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-check-windows-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-check-windows-

      - name: Install npm dependencies
        run: npm ci

      - name: Vite build (frontend)
        run: npx vite build

      # tauri.conf.json declares binaries/voice-mirror-mcp as an externalBin;
      # the tauri build script fails if the target-triple file is missing.
      - name: Build MCP sidecar
        working-directory: src-tauri
        shell: bash
        run: |
          # Placeholders first: the sidecar is a bin of the same crate, so
          # building it runs the same tauri build script that checks the file.
          # tools/espeak-ng is provisioned locally and gitignored; an empty dir
          # satisfies the bundle-resource existence check (CI bundles built
          # here are smoke builds — shipping installers are staged locally
          # where the real espeak-ng exists).
          mkdir -p ../tools/espeak-ng
          mkdir -p binaries
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          touch "binaries/voice-mirror-mcp-$triple$ext"
          cargo build --bin voice-mirror-mcp
          cp "target/debug/voice-mirror-mcp$ext" "binaries/voice-mirror-mcp-$triple$ext"

      - name: Cargo check
        run: cargo check
        working-directory: src-tauri

      # Report-only for now: clippy has never run against the Windows-only
      # code paths and finds 69 pre-existing lints (too_many_arguments,
      # type_complexity, ...). Restore `-- -D warnings` once they're fixed.
      - name: Cargo clippy (report only)
        run: cargo clippy
        working-directory: src-tauri
        continue-on-error: true

  # ---- Test: cargo test + npm test ----
  # Windows runner: see note on the check job.
  test:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      # LLVM for whisper-rs (libclang)
      - name: Install LLVM
        run: choco install llvm --yes --no-progress
        shell: pwsh

      - name: Set LIBCLANG_PATH
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-test-windows-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-test-windows-

      - name: Install npm dependencies
        run: npm ci

      # tauri.conf.json declares binaries/voice-mirror-mcp as an externalBin;
      # the tauri build script fails if the target-triple file is missing.
      - name: Build MCP sidecar
        working-directory: src-tauri
        shell: bash
        run: |
          # Placeholders first: the sidecar is a bin of the same crate, so
          # building it runs the same tauri build script that checks the file.
          # tools/espeak-ng is provisioned locally and gitignored; an empty dir
          # satisfies the bundle-resource existence check (CI bundles built
          # here are smoke builds — shipping installers are staged locally
          # where the real espeak-ng exists).
          mkdir -p ../tools/espeak-ng
          mkdir -p binaries
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          touch "binaries/voice-mirror-mcp-$triple$ext"
          cargo build --bin voice-mirror-mcp
          cp "target/debug/voice-mirror-mcp$ext" "binaries/voice-mirror-mcp-$triple$ext"

      # Compile-proof only: the test harness exe fails to LOAD on Windows
      # with STATUS_ENTRYPOINT_NOT_FOUND — pre-existing, tracked in #45.
      # Restore `cargo test` when that's fixed.
      - name: Cargo build tests (see issue 45)
        run: cargo build --tests
        working-directory: src-tauri

      - name: Run npm tests
        run: npm test

  # ---- Build: Tauri app on all platforms ----
  build:
    needs: [check, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # macOS/Linux disabled: the Rust backend doesn't compile off-Windows
          # yet (un-gated `windows` crate usage). Re-add with the port.
          # - os: macos-latest
          #   target: x86_64-apple-darwin
          # - os: ubuntu-latest
          #   target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-build-${{ matrix.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-build-${{ matrix.os }}-

      # Linux: install Tauri + audio dev dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev cmake pkg-config \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxext-dev libxfixes-dev libxtst-dev libxft-dev \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Windows: install LLVM for whisper-rs (libclang)
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm --yes --no-progress
        shell: pwsh

      # macOS: install dependencies
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake llvm

      - name: Set LIBCLANG_PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Set LIBCLANG_PATH (macOS)
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> $GITHUB_ENV

      - name: Install npm dependencies
        run: npm ci

      # tauri.conf.json declares binaries/voice-mirror-mcp as an externalBin;
      # the tauri build script fails if the target-triple file is missing.
      - name: Build MCP sidecar
        working-directory: src-tauri
        shell: bash
        run: |
          # Placeholders first: the sidecar is a bin of the same crate, so
          # building it runs the same tauri build script that checks the file.
          # tools/espeak-ng is provisioned locally and gitignored; an empty dir
          # satisfies the bundle-resource existence check (CI bundles built
          # here are smoke builds — shipping installers are staged locally
          # where the real espeak-ng exists).
          mkdir -p ../tools/espeak-ng
          mkdir -p binaries
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          touch "binaries/voice-mirror-mcp-${{ matrix.target }}$ext"
          cargo build --release --bin voice-mirror-mcp --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/voice-mirror-mcp$ext" \
             "binaries/voice-mirror-mcp-${{ matrix.target }}$ext"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Updater artifacts need the signing key — release-only. CI smoke
          # builds skip them so signing secrets never flow into PR runs.
          args: --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tauri-${{ matrix.os }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: warn
